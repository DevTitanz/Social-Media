services:
  - type: web
    name: ml-sentiment-app
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DEFAULT_SENTIMENT_MODEL
        value: logistic_regression
