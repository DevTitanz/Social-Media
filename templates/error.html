<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container text-center mt-5">
    <div class="card">
        <div class="card-header bg-danger text-white">
            <h2>Error</h2>
        </div>
        <div class="card-body">
            <div class="alert alert-danger" role="alert">
                <h4 class="alert-heading">Something went wrong</h4>
                <p>{{ error }}</p>
            </div>
            <hr>
            <p class="card-text">Please check the following:</p>
            <ul class="text-start d-inline-block">
                <li>Make sure the model is trained (run <code>python train_model.py</code>)</li>
                <li>For YouTube: Check the video URL and ensure comments are enabled</li>
                <li>For CSV: Ensure the file is a valid CSV with text data</li>
            </ul>
            <div class="mt-4">
                <a href="/" class="btn btn-primary">Go Back</a>
            </div>
        </div>
    </div>
</div>
